<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#0f0c1e"/>
    </linearGradient>
    <linearGradient id="wave" x1="16" y1="48" x2="80" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <rect width="96" height="96" rx="22" fill="url(#sheen)"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <rect x="16"   y="39" width="6" height="18" rx="3" fill="url(#wave)" opacity="0.7"/>
    <rect x="25.5" y="33" width="6" height="30" rx="3" fill="url(#wave)" opacity="0.8"/>
    <rect x="35"   y="26" width="6" height="44" rx="3" fill="url(#wave)" opacity="0.9"/>
    <rect x="44.5" y="20" width="7" height="56" rx="3.5" fill="url(#wave)"/>
    <rect x="55"   y="26" width="6" height="44" rx="3" fill="url(#wave)" opacity="0.9"/>
    <rect x="64.5" y="33" width="6" height="30" rx="3" fill="url(#wave)" opacity="0.8"/>
    <rect x="74"   y="39" width="6" height="18" rx="3" fill="url(#wave)" opacity="0.7"/>
  </g>
</svg>